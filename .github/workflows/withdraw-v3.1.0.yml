name: Withdraw v3.1.0 from GHCR
on:
  push:
    branches: [chore/withdraw-v3.1.0]
    paths: [.github/workflows/withdraw-v3.1.0.yml]

permissions:
  contents: read
  packages: write

jobs:
  withdraw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GHCR_USER: ${{ secrets.GHCR_LOGIN }}
      GHCR_TOKEN: ${{ secrets.GHCR_PASSWORD }}
      API_TOKEN: ${{ github.token }}
    steps:
      - name: Restore stable tags and delete only v3.1.0 package versions
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.request

          package = 'roadrunner-server/roadrunner'
          good = 'sha256:ec454523b213aa1e1dd1b2a935ce3643b658bd6f1c24ac22acabeb1ae1efbb54'
          bad = 'sha256:dcf51163807bff3366a5c7dcff0d5e50030eeeb04a6739724b0e843abe2a978a'
          accept = 'application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json'

          def request(url, method='GET', data=None, headers=None):
              req = urllib.request.Request(url, data=data, headers=headers or {}, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.status, response.read()

          basic = base64.b64encode(f"{os.environ['GHCR_USER']}:{os.environ['GHCR_TOKEN']}".encode()).decode()
          _, body = request(f'https://ghcr.io/token?service=ghcr.io&scope=repository:{package}:pull,push', headers={'Authorization': f'Basic {basic}'})
          token = json.loads(body)['token']
          registry_headers = {'Authorization': f'Bearer {token}', 'Accept': accept}
          base = f'https://ghcr.io/v2/{package}/manifests/'
          _, stable = request(base + '3.0.0', headers=registry_headers)
          _, withdrawn = request(base + '3.1.0', headers=registry_headers)
          assert 'sha256:' + hashlib.sha256(stable).hexdigest() == good
          assert 'sha256:' + hashlib.sha256(withdrawn).hexdigest() == bad
          targets = {bad} | {m['digest'] for m in json.loads(withdrawn)['manifests']}
          retained = {good} | {m['digest'] for m in json.loads(stable)['manifests']}
          assert targets.isdisjoint(retained)

          api_base = 'https://api.github.com/orgs/roadrunner-server/packages/container/roadrunner/versions'
          api_headers = {'Authorization': f"Bearer {os.environ['API_TOKEN']}", 'Accept': 'application/vnd.github+json'}
          _, body = request(api_base + '?per_page=100', headers=api_headers)
          versions = [v for v in json.loads(body) if v['name'] in targets]
          assert {v['name'] for v in versions} == targets, 'Could not identify every v3.1.0 manifest'
          for version in versions:
              assert set(version['metadata']['container']['tags']) <= {'3.1.0', '3.1', '3', 'latest'}, version['id']

          for tag in ['latest', '3']:
              _, current = request(base + tag, headers=registry_headers)
              assert 'sha256:' + hashlib.sha256(current).hexdigest() in {good, bad}
              status, _ = request(base + tag, 'PUT', stable, {**registry_headers, 'Content-Type': json.loads(stable)['mediaType']})
              assert status == 201
              _, current = request(base + tag, headers=registry_headers)
              assert 'sha256:' + hashlib.sha256(current).hexdigest() == good
              print(f'Restored GHCR {tag} to 3.0.0', flush=True)

          for version in sorted(versions, key=lambda v: v['name'] != bad):
              _, current = request(api_base + '/' + str(version['id']), headers=api_headers)
              assert set(json.loads(current)['metadata']['container']['tags']) <= {'3.1.0', '3.1'}
              status, _ = request(api_base + '/' + str(version['id']), 'DELETE', headers=api_headers)
              assert status == 204
              print(f"Deleted GHCR version {version['id']} ({version['name']})", flush=True)

          for reference in ['3.1.0', '3.1', *sorted(targets)]:
              try:
                  request(base + reference, headers=registry_headers)
              except urllib.error.HTTPError as error:
                  assert error.code == 404, (reference, error.code)
              else:
                  raise AssertionError(f'{reference} is still available')
          print('Verified v3.1.0 tags and manifests are unavailable', flush=True)
          PY
