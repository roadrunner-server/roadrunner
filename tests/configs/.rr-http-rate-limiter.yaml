version: '3'

rpc:
  listen: tcp://127.0.0.1:6208

server:
  command: "php php_test_files/http/client.php echo pipes"
  relay: pipes

logs:
  level: error

http:
  address: 127.0.0.1:18953
  middleware: ["rate_limiter"]
  rate_limiter:
    key: global
    rate: 1
    interval: 1h
    burst: 1
  pool:
    num_workers: 1
    allocate_timeout: 10s
    destroy_timeout: 5s
